<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Bear.6305 - GW2 WvW Leaderboards</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* Additional CSS custom properties for player pages */
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --main-bg: #ffffff;
            --text-color: #333333;
            --text-color-secondary: #666666;
            --text-color-light: #ffffff;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --hover-bg: #f8f9fa;
            --button-bg: rgba(255,255,255,0.2);
            --button-border: rgba(255,255,255,0.3);
            --button-hover: rgba(255,255,255,0.3);
            --button-active: rgba(255,255,255,0.4);
            --shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            --main-bg: #2c3e50;
            --text-color: #ecf0f1;
            --text-color-secondary: #bdc3c7;
            --text-color-light: #ffffff;
            --card-bg: #34495e;
            --border-color: #4a6741;
            --hover-bg: #3c5a99;
            --button-bg: rgba(255,255,255,0.1);
            --button-border: rgba(255,255,255,0.2);
            --button-hover: rgba(255,255,255,0.2);
            --button-active: rgba(255,255,255,0.3);
            --shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background: var(--bg-gradient);
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .player-header {
            background: var(--bg-gradient);
            color: var(--text-color-light);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        
        .player-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .player-subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }
        
        .player-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stats-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        
        .stats-card:hover {
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }
        
        .stats-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }
        
        .stat-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        
        .stat-label {
            color: var(--text-color-secondary);
            font-weight: 500;
        }
        
        .stat-value {
            color: var(--text-color);
            font-weight: bold;
        }
        
        .metric-performance {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .metric-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .metric-table th,
        .metric-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
        }
        
        .metric-table th {
            background: var(--hover-bg);
            font-weight: bold;
        }
        
        .rank-good {
            color: #28a745;
            font-weight: bold;
        }
        
        .rank-average {
            color: #ffc107;
            font-weight: bold;
        }
        
        .rank-poor {
            color: #dc3545;
            font-weight: bold;
        }
        
        .profession-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        
        .profession-tag {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .profession-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        
        .profession-tab-button {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            color: var(--text-color);
        }
        
        .profession-tab-button:hover {
            background: var(--hover-bg);
            border-color: var(--text-color-secondary);
        }
        
        .profession-tab-button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .profession-metric-table {
            display: none;
            margin-bottom: 20px;
        }
        
        .profession-metric-table.active {
            display: block;
        }
        
        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .nav-button {
            background: var(--button-bg);
            border: 2px solid var(--button-border);
            color: var(--text-color-light);
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .nav-button:hover {
            background: var(--button-hover);
            border-color: rgba(255,255,255,0.5);
            text-decoration: none;
            color: var(--text-color-light);
        }
        
        .dark-mode-toggle {
            background: var(--button-bg);
            border: 2px solid var(--button-border);
            border-radius: 50px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-color-light);
            font-size: 1.2rem;
            min-width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dark-mode-toggle:hover {
            background: var(--button-hover);
            border-color: rgba(255,255,255,0.5);
            transform: scale(1.05);
        }

        .toggle-icon {
            transition: transform 0.3s ease;
            font-size: 1.2rem;
        }
        
        .date-filter-button:hover {
            background: var(--button-hover);
            border-color: rgba(255,255,255,0.5);
        }

        .date-filter-button.active {
            background: var(--button-active);
            border-color: rgba(255,255,255,0.6);
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .player-stats-grid {
                grid-template-columns: 1fr;
            }
            
            .nav-buttons {
                flex-direction: column;
            }
            
            .player-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

    <div class="container">

        <div class="player-header">

            <div class="stats-card">

        </div>
        
        <div class="stats-card">

        </div>
    </div>

                    <span class="stat-value">${bestPercentile.toFixed(1)}%</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Total Metrics:</span>
                    <span class="stat-value">${playerData.metric_summaries.length}</span>
                </div>
            `;
            
            // Activity stats
            const activityStats = document.getElementById('activityStats');
            const firstDate = playerData.profile.first_session;
            const lastDate = playerData.profile.last_session;
            const formattedFirst = `${firstDate.substr(4,2)}/${firstDate.substr(6,2)}/${firstDate.substr(0,4)}`;
            const formattedLast = `${lastDate.substr(4,2)}/${lastDate.substr(6,2)}/${lastDate.substr(0,4)}`;
            
            activityStats.innerHTML = `
                <div class="stat-row">
                    <span class="stat-label">First Session:</span>
                    <span class="stat-value">${formattedFirst}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Latest Session:</span>
                    <span class="stat-value">${formattedLast}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Sessions/Week:</span>
                    <span class="stat-value">${(playerData.profile.total_sessions / (playerData.profile.activity_days / 7)).toFixed(1)}</span>
                </div>
            `;
            
            // Profession-specific metric tables
            loadProfessionMetrics();
            
            // Profession stats
            const professionStats = document.getElementById('professionStats');
            professionStats.innerHTML = `
                <div class="stat-row">
                    <span class="stat-label">Professions Played:</span>
                    <span class="stat-value">${playerData.profile.professions_played.length}</span>
                </div>
                <div class="profession-list">
                    ${playerData.profile.professions_played.map(prof => 
                        `<span class="profession-tag">${prof}</span>`
                    ).join('')}
                </div>
            `;
        }
        
        function switchDateFilter(dateFilter) {
            // Check if data exists for this filter
            if (!allPlayerData[dateFilter]) {
                console.warn(`No data available for ${dateFilter} filter`);
                return;
            }
            
            // Switch to new data
            playerData = allPlayerData[dateFilter];
            currentDateFilter = dateFilter;
            
            // Update UI with new data
            loadPlayerData();
            
            // Update active filter button
            document.querySelectorAll('.date-filter-button').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.filter === dateFilter) {
                    btn.classList.add('active');
                }
            });
        }
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            initializeDarkMode();
            loadPlayerData();
            
            // Dark mode toggle
            document.getElementById('darkModeToggle').addEventListener('click', toggleDarkMode);
            
            // Date filter buttons
            document.querySelectorAll('.date-filter-button').forEach(button => {
                button.addEventListener('click', function() {
                    const filter = this.dataset.filter;
                    if (filter !== currentDateFilter) {
                        switchDateFilter(filter);
                    }
                });
            });
        });
    </script>
</body>
</html>
